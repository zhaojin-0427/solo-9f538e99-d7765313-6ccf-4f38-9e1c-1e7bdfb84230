services:
  fleet:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLEET_DATA_DIR: /data
      FLEET_WAITING_DAYS: "30"
      FLEET_SECRET_KEY: "change-me-in-production"
    volumes:
      - fleet-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fleet-data:
